name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0" # the native shell is covered by the build job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Integration tests (real Chrome, temp profiles, ports 19222+)
        run: go test -tags integration ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -tags server ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags integration

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os: windows, arch: amd64, variant: gui }
          - { runner: ubuntu-latest, os: linux, arch: amd64, variant: server }
          - { runner: ubuntu-24.04, os: linux, arch: amd64, variant: gui }
          - { runner: macos-latest, os: darwin, arch: arm64, variant: gui }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GUI libraries (Linux)
        if: matrix.os == 'linux' && matrix.variant == 'gui'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: Build and check size budget
        run: go run ./tools/build -os ${{ matrix.os }} -arch ${{ matrix.arch }} -variant ${{ matrix.variant }} -version ci -out dist
